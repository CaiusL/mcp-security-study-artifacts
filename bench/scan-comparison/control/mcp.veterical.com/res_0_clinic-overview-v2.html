<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://mcp.veterical.com; img-src data: https://www.veterical.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; frame-ancestors https://chatgpt.com https://claude.ai">
<style>
  :root {
    --veterical-background-secondary: #f7f7fb;
    --veterical-border-primary: #e5e4f2;
    --veterical-text-primary: #20202b;
    --veterical-text-secondary: #686879;
    color: var(--color-text-primary, var(--veterical-text-primary));
    color-scheme: light;
    font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
  }
  :root[data-theme='dark'] {
    --veterical-background-secondary: #282735;
    --veterical-border-primary: #49485b;
    --veterical-text-primary: #faf9ff;
    --veterical-text-secondary: #b9b7c9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: transparent; margin: 0; }
  #veterical-root { display: grid; gap: 18px; padding: 18px; }
  .header { align-items: center; display: flex; gap: 12px; }
  .mark { align-items: center; background: #7371fc; border-radius: 12px; color: #fff; display: flex; font-size: 14px; font-weight: 800; height: 44px; justify-content: center; letter-spacing: -.04em; width: 44px; }
  h1 { font-size: 19px; line-height: 1.25; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .subtle { color: var(--color-text-secondary, var(--veterical-text-secondary)); font-size: 13px; margin: 3px 0 0; }
  .metrics { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
  .card { background: var(--color-background-secondary, var(--veterical-background-secondary)); border: 1px solid var(--color-border-primary, var(--veterical-border-primary)); border-radius: 12px; padding: 12px; }
  .label { color: var(--color-text-secondary, var(--veterical-text-secondary)); display: block; font-size: 12px; }
  .value { display: block; font-size: 22px; margin-top: 3px; }
  .list { border: 1px solid var(--color-border-primary, var(--veterical-border-primary)); border-radius: 12px; overflow: hidden; }
  .row { align-items: center; border-top: 1px solid var(--color-border-primary, var(--veterical-border-primary)); display: flex; font-size: 13px; gap: 12px; justify-content: space-between; padding: 10px 12px; }
  .row:first-child { border-top: 0; }
  .row > span:last-child { color: var(--color-text-secondary, var(--veterical-text-secondary)); }
  .empty, .notice { color: var(--color-text-secondary, var(--veterical-text-secondary)); font-size: 13px; padding: 12px; }
  @media (max-width: 680px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .metrics { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="veterical-root" aria-live="polite">Loading Veterical clinic overview…</main>
